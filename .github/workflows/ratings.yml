name: Update ratings

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      refresh_history:
        description: Refetch all historical source years
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ratings-publication
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publication.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.19'
      - name: Install CmdStan
        id: cmdstan
        continue-on-error: true
        timeout-minutes: 15
        run: Rscript -e 'dir.create("renv/local/cmdstan", recursive=TRUE, showWarnings=FALSE); cmdstanr::install_cmdstan(dir="renv/local/cmdstan", version="2.40.0", cores=2)'
      - run: make check
      - name: Fetch, prepare, fit, and render
        env:
          REFRESH_HISTORY: ${{ inputs.refresh_history }}
        run: |
          args=(update)
          if [[ "$REFRESH_HISTORY" == "true" ]]; then
            args+=(--refresh)
          fi
          Rscript scripts/pipeline.R "${args[@]}"
      - name: Fit and publish current Test models
        id: current_models
        if: steps.cmdstan.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          make model-data
          make current-models
          make visualize-models
          make publish-models
      - name: Report retained model ratings
        if: steps.cmdstan.outcome != 'success' || steps.current_models.outcome != 'success'
        run: echo '::warning::Current model update failed. Publishing Elo with the previous model ratings and their original cutoff.'
      - name: Validate website before publishing data
        run: make site
      - name: Publish validated results
        id: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/build data/context out/analysis figs out/release
          if ! git diff --cached --quiet; then
            git commit -m 'Update cricket ratings'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  site:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.commit }}
