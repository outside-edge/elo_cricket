name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - run: make check
      - name: Install CmdStan and test the dynamic model
        run: |
          Rscript -e 'dir.create("renv/local/cmdstan", recursive=TRUE, showWarnings=FALSE); cmdstanr::install_cmdstan(dir="renv/local/cmdstan", version="2.40.0", cores=2)'
          make check-models
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.19'
      - run: make site
      - name: Capture website previews
        run: |
          mkdir -p out/previews
          for page in index docs/test docs/odi docs/t20i; do
            for size in 1440,1800 480,2000; do
              google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
                --timeout=15000 --window-size="$size" \
                --screenshot="out/previews/${page##*/}-${size%,*}.png" \
                "file://$PWD/out/site/$page.html"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-previews
          path: out/previews
          retention-days: 7
